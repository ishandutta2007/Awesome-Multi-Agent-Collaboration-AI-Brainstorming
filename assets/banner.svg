<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e113a" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    /* Dynamic pulsing & floating background animations */
    @keyframes floatAgent1 {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(6px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes floatAgent2 {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(14px) translateX(-8px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
      100% { opacity: 0.35; transform: scale(1); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }

    .bg-pulse-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 250px 180px;
    }
    .bg-pulse-2 {
      animation: pulseGlow 8s ease-in-out infinite 3s;
      transform-origin: 950px 240px;
    }
    .agent-node-1 {
      animation: floatAgent1 5s ease-in-out infinite;
    }
    .agent-node-2 {
      animation: floatAgent2 7s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 8 6;
      animation: dashMove 2.5s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glow Blobs in Background -->
  <circle class="bg-pulse-1" cx="220" cy="170" r="140" fill="url(#glowGrad1)" filter="url(#blurFilter)" />
  <circle class="bg-pulse-2" cx="980" cy="250" r="160" fill="url(#glowGrad2)" filter="url(#blurFilter)" />

  <!-- Tech Grid Overlay in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Agent Network Constellations (Lower Background Layer) -->
  <g opacity="0.45">
    <path class="stream-line" d="M 120 330 Q 300 370 480 340 T 800 350 T 1080 320" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="stream-line" d="M 140 80 Q 400 40 680 70 T 1060 90" fill="none" stroke="#06b6d4" stroke-width="2" />
  </g>

  <!-- Left Dynamic Agent Card (Floating in background corners) -->
  <g class="agent-node-1" transform="translate(45, 120)" opacity="0.85">
    <rect width="130" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" filter="url(#pillShadow)" />
    <circle cx="25" cy="30" r="10" fill="#0284c7" />
    <text x="25" y="34" font-size="11" text-anchor="middle" fill="#ffffff" font-family="sans-serif">🤖</text>
    <text x="44" y="27" font-size="11" font-weight="600" fill="#e2e8f0" font-family="sans-serif">Agent Alpha</text>
    <text x="44" y="42" font-size="9" fill="#94a3b8" font-family="sans-serif">Ideation Critic</text>
  </g>

  <!-- Right Dynamic Agent Card (Floating in background corners) -->
  <g class="agent-node-2" transform="translate(1025, 230)" opacity="0.85">
    <rect width="130" height="60" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" filter="url(#pillShadow)" />
    <circle cx="25" cy="30" r="10" fill="#9333ea" />
    <text x="25" y="34" font-size="11" text-anchor="middle" fill="#ffffff" font-family="sans-serif">🧠</text>
    <text x="44" y="27" font-size="11" font-weight="600" fill="#e2e8f0" font-family="sans-serif">Synthesizer</text>
    <text x="44" y="42" font-size="9" fill="#94a3b8" font-family="sans-serif">Consensus Engine</text>
  </g>

  <!-- FOREGROUND: Clean, Sharp Hero Titles & Badges (Completely clear and readable) -->
  <g id="foreground-hero">
    <!-- Top Pill / Category Label -->
    <g transform="translate(600, 72)">
      <rect x="-175" y="-16" width="350" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <circle cx="-148" cy="0" r="5" fill="#10b981" />
      <text x="-132" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">
        CURATED AWESOME ECOSYSTEM • 2026
      </text>
    </g>

    <!-- Main Title -->
    <text class="title-text" x="600" y="160" font-size="44" text-anchor="middle" fill="#ffffff">
      Awesome Multi-Agent Collaboration
    </text>

    <!-- Subtitle / Highlight Text -->
    <text class="title-text" x="600" y="215" font-size="34" text-anchor="middle" fill="url(#textGrad)">
      &amp; AI Brainstorming
    </text>

    <!-- Descriptive Subtitle Line -->
    <text class="subtitle-text" x="600" y="265" font-size="16" text-anchor="middle" fill="#94a3b8">
      Collaborative Agent Rooms • Multi-LLM Council Debates • Consensus Engines • Visual Ideation Canvases
    </text>

    <!-- Feature Pills in Bottom Row -->
    <g transform="translate(600, 325)">
      <!-- Pill 1 -->
      <g transform="translate(-320, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
        <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="500" fill="#38bdf8" text-anchor="middle">⚡ Group Chats</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-160, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
        <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="500" fill="#818cf8" text-anchor="middle">🏛️ LLM Councils</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
        <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="500" fill="#c084fc" text-anchor="middle">🔄 Debate Loops</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(160, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#34d399" stroke-width="1.2" />
        <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="500" fill="#34d399" text-anchor="middle">🎨 Visual Canvases</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(320, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#f472b6" stroke-width="1.2" />
        <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="500" fill="#f472b6" text-anchor="middle">🧩 Mixture-of-Agents</text>
      </g>
    </g>
  </g>
</svg>
